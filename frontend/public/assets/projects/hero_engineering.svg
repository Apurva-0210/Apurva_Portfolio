    <rect width="552" height="74" rx="8" fill="#4B0509" stroke="#FFF0DC" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="276" y="32" fill="#FFF0DC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">DDR5 / LPDDR4x MEMORY CONTROLLER &amp; PCIe GEN4 PHY</text>
