    <path d="M 448 350 L 320 350 L 220 280 L 80 280"/>
    <circle cx="80" cy="280" r="4" fill="#FFF0DC"/>
    <path d="M 448 440 L 300 440 L 180 390 L 60 390"/>
    <circle cx="60" cy="390" r="4" fill="#FFF0DC"/>
    <path d="M 448 520 L 310 520 L 190 590 L 90 590"/>
    <circle cx="90" cy="590" r="4" fill="#FFF0DC"/>
    <path d="M 448 610 L 330 610 L 240 700 L 110 700"/>
    <circle cx="110" cy="700" r="4" fill="#FFF0DC"/>
    <path d="M 448 700 L 360 700 L 270 810 L 140 810"/>
    <circle cx="140" cy="810" r="4" fill="#FFF0DC"/>

    <!-- Right Fan-out Bus Lines -->
    <path d="M 1088 300 L 1196 300 L 1276 220 L 1416 220"/>
    <circle cx="1416" cy="220" r="4" fill="#FFF0DC"/>
    <path d="M 1088 350 L 1216 350 L 1316 280 L 1456 280"/>
    <circle cx="1456" cy="280" r="4" fill="#FFF0DC"/>
    <path d="M 1088 440 L 1236 440 L 1356 390 L 1476 390"/>
    <circle cx="1476" cy="390" r="4" fill="#FFF0DC"/>
    <path d="M 1088 520 L 1226 520 L 1346 590 L 1446 590"/>
    <circle cx="1446" cy="590" r="4" fill="#FFF0DC"/>
    <path d="M 1088 610 L 1206 610 L 1296 700 L 1426 700"/>
    <circle cx="1426" cy="700" r="4" fill="#FFF0DC"/>
    <path d="M 1088 700 L 1176 700 L 1266 810 L 1396 810"/>
    <circle cx="1396" cy="810" r="4" fill="#FFF0DC"/>
