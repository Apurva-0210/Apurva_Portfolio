      <circle cx="72" cy="52" r="3"/>
      <circle cx="108" cy="52" r="3"/>
      <circle cx="144" cy="52" r="3"/>
      <circle cx="180" cy="52" r="3"/>
      <circle cx="216" cy="52" r="3"/>
      <circle cx="252" cy="52" r="3"/>
      <circle cx="288" cy="52" r="3"/>
      <circle cx="324" cy="52" r="3"/>
      <circle cx="360" cy="52" r="3"/>
      <circle cx="396" cy="52" r="3"/>
      <circle cx="432" cy="52" r="3"/>
      <circle cx="468" cy="52" r="3"/>
      <circle cx="504" cy="52" r="3"/>
