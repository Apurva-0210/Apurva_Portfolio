  <!-- Technical Telemetry Labels Left & Right -->
  <g fill="#FFF0DC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" letter-spacing="1">
    <text x="130" y="212" opacity="0.8">CLK_DIFF_100MHZ [PLL_0]</text>
    <text x="90" y="272" opacity="0.8">CAN_HIGH / LOW [ECU_BUS]</text>
    <text x="70" y="382" opacity="0.8">UART_0_TXRX [TELEMETRY]</text>
    <text x="100" y="582" opacity="0.8">SPI_MOSI [ADC_SENSORS]</text>
    <text x="120" y="692" opacity="0.8">I2C_SDA_SCL [COMPOSITE_GAS]</text>
    <text x="150" y="802" opacity="0.8">ETH_TSN [CARLA_BRIDGE]</text>

    <text x="1270" y="212" opacity="0.8" text-anchor="end">DDR5_DQ[0..63] [DATA_BUS]</text>
    <text x="1310" y="272" opacity="0.8" text-anchor="end">PCIe_GEN4_LANE[0..3]</text>
    <text x="1350" y="382" opacity="0.8" text-anchor="end">JTAG_SWD [DEBUG_PORT]</text>
    <text x="1340" y="582" opacity="0.8" text-anchor="end">GPIO_PWM [MOTOR_ACTUATOR]</text>
    <text x="1290" y="692" opacity="0.8" text-anchor="end">NPU_DMA [CBAM_STREAM]</text>
    <text x="1260" y="802" opacity="0.8" text-anchor="end">RST_PWR_GOOD [SYS_CTRL]</text>
  </g>

  <!-- Title / Chip Identity Metadata Block (Subtle Watermark in Corner) -->
  <g transform="translate(48, 930)" fill="#FFF0DC" font-family="'Space Grotesk', system-ui, sans-serif">
    <text x="0" y="0" font-size="13" font-weight="700" letter-spacing="1.5" opacity="0.9">APURVA KUMAR // HARDWARE-SYSTEMS SOC ARCHITECTURE</text>
    <text x="0" y="18" font-size="10" opacity="0.65" letter-spacing="1">PROCESS NODE: 16nm FINFET · gem5 v25.1 · FreeRTOS · CARLA SIMULATION</text>
  </g>
  <g transform="translate(1488, 930)" fill="#FFF0DC" font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="end">
    <text x="0" y="0" font-size="13" font-weight="700" letter-spacing="1.5" opacity="0.9">STATUS: DETERMINISTIC PASS</text>
    <text x="0" y="18" font-size="10" opacity="0.65" letter-spacing="1">CYCLE-ACCURATE TIMING VERIFIED</text>
  </g>
