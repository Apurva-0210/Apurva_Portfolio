    <text x="128" y="46" fill="#FFF0DC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">EDGE NPU / CBAM ENGINE</text>
