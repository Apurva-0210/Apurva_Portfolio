      <circle cx="110" cy="72" r="8" fill="#790B13"/>
      <circle cx="166" cy="72" r="8" fill="#790B13"/>
      <circle cx="220" cy="72" r="8" fill="#790B13"/>
      <line x1="64" y1="72" x2="102" y2="72"/>
      <line x1="118" y1="72" x2="158" y2="72"/>
      <line x1="174" y1="72" x2="212" y2="72"/>
