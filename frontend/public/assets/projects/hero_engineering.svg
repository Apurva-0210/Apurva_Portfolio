    <rect x="24" y="106" width="208" height="12" rx="3" fill="#790B13" stroke="#FFF0DC" stroke-width="0.8" stroke-opacity="0.3"/>
    <rect x="26" y="108" width="160" height="8" rx="2" fill="#FFF0DC" fill-opacity="0.85"/>
