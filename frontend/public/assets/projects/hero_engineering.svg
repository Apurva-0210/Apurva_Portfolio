  <rect x="458" y="232" width="620" height="560" rx="12" fill="url(#denseChipGrid)"/>
  <rect x="470" y="244" width="596" height="536" rx="8" fill="none" stroke="#FFF0DC" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6 4"/>

