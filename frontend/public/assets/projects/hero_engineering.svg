  <rect width="1536" height="1024" fill="url(#pcbGrid)"/>
  <circle cx="768" cy="512" r="540" fill="url(#dieCoreGlow)"/>

  <!-- Outer Semiconductor Wafer Ring -->
  <circle cx="768" cy="512" r="460" fill="none" stroke="#FFF0DC" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6"/>
  <circle cx="768" cy="512" r="440" fill="none" stroke="#FFF0DC" stroke-width="1" stroke-opacity="0.18"/>
  <circle cx="768" cy="512" r="390" fill="none" stroke="#FFF0DC" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="768" cy="512" r="380" fill="none" stroke="#FF4D4D" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 8"/>

  <!-- Angle Ticks & Coordinate Markings -->
  <g stroke="#FFF0DC" stroke-width="1.2" stroke-opacity="0.4">
    <line x1="768" y1="42" x2="768" y2="72"/>
    <line x1="768" y1="952" x2="768" y2="982"/>
    <line x1="298" y1="512" x2="328" y2="512"/>
    <line x1="1208" y1="512" x2="1238" y2="512"/>
    <line x1="436" y1="180" x2="456" y2="200"/>
    <line x1="1100" y1="180" x2="1080" y2="200"/>
    <line x1="436" y1="844" x2="456" y2="824"/>
    <line x1="1100" y1="844" x2="1080" y2="824"/>
  </g>

  <!-- Silicon Chip Core Substrate -->
