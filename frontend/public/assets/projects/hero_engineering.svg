    <text x="138" y="70" fill="#FFF0DC" fill-opacity="0.8" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" text-anchor="middle">ISO 15765-4 / OBD-II Diagnostics</text>
    <text x="138" y="90" fill="#FFF0DC" fill-opacity="0.65" font-family="'Space Grotesk', system-ui, sans-serif" font-size="9" text-anchor="middle">Multi-Modal Radar · LiDAR · CARLA Bridge</text>
