<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <radialGradient id="heroBgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#99111C" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#790B13" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#460408" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="dieCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0DC" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#FF3846" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#790B13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ivoryTrace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0DC" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFDDB3" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFF0DC" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="busLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF0DC" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FFF0DC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF0DC" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="pcbGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFF0DC" stroke-width="0.75" stroke-opacity="0.08"/>
      <circle cx="24" cy="24" r="1.2" fill="#FFF0DC" fill-opacity="0.12"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF0DC" fill-opacity="0.18"/>
    </pattern>
    <pattern id="denseChipGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="none" stroke="#FFF0DC" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

