    <text x="66" y="52" fill="#FFF0DC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">CORE 0</text>
    <text x="66" y="70" fill="#FFF0DC" fill-opacity="0.75" font-family="'Space Grotesk', system-ui, sans-serif" font-size="9" text-anchor="middle">L1-I / L1-D</text>

    <rect x="134" y="10" width="112" height="96" rx="4" fill="#6A0A10" stroke="#FFF0DC" stroke-width="1" stroke-opacity="0.35"/>
    <text x="190" y="52" fill="#FFF0DC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">CORE 1</text>
    <text x="190" y="70" fill="#FFF0DC" fill-opacity="0.75" font-family="'Space Grotesk', system-ui, sans-serif" font-size="9" text-anchor="middle">L1-I / L1-D</text>

    <rect x="10" y="118" width="112" height="96" rx="4" fill="#6A0A10" stroke="#FFF0DC" stroke-width="1" stroke-opacity="0.35"/>
    <text x="66" y="160" fill="#FFF0DC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">CORE 2</text>
    <text x="66" y="178" fill="#FFF0DC" fill-opacity="0.75" font-family="'Space Grotesk', system-ui, sans-serif" font-size="9" text-anchor="middle">L1-I / L1-D</text>

    <rect x="134" y="118" width="112" height="96" rx="4" fill="#6A0A10" stroke="#FFF0DC" stroke-width="1" stroke-opacity="0.35"/>
    <text x="190" y="160" fill="#FFF0DC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">CORE 3</text>
    <text x="190" y="178" fill="#FFF0DC" fill-opacity="0.75" font-family="'Space Grotesk', system-ui, sans-serif" font-size="9" text-anchor="middle">L1-I / L1-D</text>
  </g>

