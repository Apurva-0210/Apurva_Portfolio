<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <radialGradient id="ctaBgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#8F0D16" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#790B13" stop-opacity="1"/>
      <stop offset="100%" stop-color="#360306" stop-opacity="1"/>
    </radialGradient>
    <pattern id="blueprintGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFF0DC" stroke-width="0.75" stroke-opacity="0.08"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#FFF0DC" stroke-width="1.2" stroke-opacity="0.14"/>
    </pattern>
    <pattern id="isoDotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#FFF0DC" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1536" height="1024" fill="url(#ctaBgGlow)"/>
  <rect width="1536" height="1024" fill="url(#blueprintGrid)"/>
  <rect width="1536" height="1024" fill="url(#isoDotGrid)"/>

  <!-- Blueprint Border Framing -->
  <rect x="32" y="32" width="1472" height="960" fill="none" stroke="#FFF0DC" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="42" y="42" width="1452" height="940" fill="none" stroke="#FFF0DC" stroke-width="0.75" stroke-opacity="0.2"/>

  <!-- Corner Alignment Crosshairs -->
  <g stroke="#FFF0DC" stroke-width="1.2" stroke-opacity="0.5">
    <line x1="60" y1="60" x2="100" y2="60"/>
    <line x1="60" y1="60" x2="60" y2="100"/>
    <line x1="1476" y1="60" x2="1436" y2="60"/>
    <line x1="1476" y1="60" x2="1476" y2="100"/>
    <line x1="60" y1="964" x2="100" y2="964"/>
    <line x1="60" y1="964" x2="60" y2="924"/>
    <line x1="1476" y1="964" x2="1436" y2="964"/>
    <line x1="1476" y1="964" x2="1476" y2="924"/>
  </g>

  <!-- Central Engineering Module Schematic (ECU & BGA Package) -->
  <g transform="translate(768, 512)" opacity="0.45">
    <!-- Outer concentric sensor radius rings -->
    <circle cx="0" cy="0" r="340" fill="none" stroke="#FFF0DC" stroke-width="1.2" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="280" fill="none" stroke="#FFF0DC" stroke-width="1"/>
    <circle cx="0" cy="0" r="220" fill="none" stroke="#FFF0DC" stroke-width="1.5" stroke-dasharray="12 4"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#FFF0DC" stroke-width="2"/>

    <!-- Central Microcontroller / SoC Package Outline -->
    <rect x="-110" y="-110" width="220" height="220" rx="12" fill="#52060B" stroke="#FFF0DC" stroke-width="2"/>
    <rect x="-90" y="-90" width="180" height="180" rx="8" fill="#5E090F" stroke="#FFF0DC" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- Die Chamfer & Pin 1 Indicator -->
    <polygon points="-80,-90 -90,-80 -90,-90" fill="#FFF0DC"/>
    <circle cx="-65" cy="-65" r="5" fill="#FFF0DC"/>

    <text x="0" y="-15" fill="#FFF0DC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">APURVA-CORE-V2</text>
    <text x="0" y="8" fill="#FFF0DC" fill-opacity="0.8" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" text-anchor="middle" letter-spacing="1">AUTOMOTIVE ECU ARCHITECTURE</text>
    <text x="0" y="28" fill="#FFF0DC" fill-opacity="0.6" font-family="'Space Grotesk', system-ui, sans-serif" font-size="9" text-anchor="middle">ASIL-D / ISO 26262 CERTIFIED</text>

    <!-- Radial Escape Routing Traces -->
    <g stroke="#FFF0DC" stroke-width="1.2" stroke-linecap="round">
      <line x1="0" y1="-110" x2="0" y2="-280"/>
      <circle cx="0" cy="-280" r="4" fill="#FFF0DC"/>
      <line x1="0" y1="110" x2="0" y2="280"/>
      <circle cx="0" cy="280" r="4" fill="#FFF0DC"/>
      <line x1="-110" y1="0" x2="-280" y2="0"/>
      <circle cx="-280" cy="0" r="4" fill="#FFF0DC"/>
      <line x1="110" y1="0" x2="280" y2="0"/>
      <circle cx="280" cy="0" r="4" fill="#FFF0DC"/>

      <line x1="-80" y1="-80" x2="-220" y2="-220"/>
      <circle cx="-220" cy="-220" r="4" fill="#FFF0DC"/>
      <line x1="80" y1="-80" x2="220" y2="-220"/>
      <circle cx="220" cy="-220" r="4" fill="#FFF0DC"/>
      <line x1="-80" y1="80" x2="-220" y2="220"/>
      <circle cx="-220" cy="220" r="4" fill="#FFF0DC"/>
      <line x1="80" y1="80" x2="220" y2="220"/>
      <circle cx="220" cy="220" r="4" fill="#FFF0DC"/>
    </g>
  </g>

  <!-- Left Side: Schematic Subsystems -->
  <g transform="translate(100, 180)" stroke="#FFF0DC" stroke-width="1.2" fill="none" opacity="0.5">
    <!-- Differential Pairs (CAN-H, CAN-L) -->
    <path d="M 0 0 L 140 0 L 180 40 L 260 40"/>
    <path d="M 0 16 L 134 16 L 174 56 L 260 56"/>
    <circle cx="260" cy="40" r="3" fill="#FFF0DC"/>
    <circle cx="260" cy="56" r="3" fill="#FFF0DC"/>
    <text x="0" y="-10" fill="#FFF0DC" stroke="none" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" letter-spacing="1">CAN_DIFF_PAIR_1MBPS</text>

    <!-- Crystal Oscillator Circuit -->
    <g transform="translate(40, 140)">
      <rect x="0" y="0" width="80" height="40" rx="4" stroke="#FFF0DC" stroke-width="1.2"/>
      <line x1="40" y1="0" x2="40" y2="-30"/>
      <line x1="40" y1="40" x2="40" y2="70"/>
      <text x="40" y="24" fill="#FFF0DC" stroke="none" font-family="'Space Grotesk', system-ui, sans-serif" font-size="9" text-anchor="middle">25.000 MHz</text>
      <circle cx="40" cy="-30" r="3" fill="#FFF0DC"/>
      <circle cx="40" cy="70" r="3" fill="#FFF0DC"/>
    </g>

    <!-- Multi-Stage Analog Front End (AFE) for Gas Sensing -->
    <g transform="translate(0, 320)">
      <polygon points="40,20 100,50 40,80" stroke="#FFF0DC" stroke-width="1.5" fill="#52060B"/>
      <line x1="0" y1="35" x2="40" y2="35"/>
      <line x1="0" y1="65" x2="40" y2="65"/>
      <line x1="100" y1="50" x2="160" y2="50"/>
      <circle cx="160" cy="50" r="3" fill="#FFF0DC"/>
      <text x="0" y="16" fill="#FFF0DC" stroke="none" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10">INSTRUMENTATION AMP (PANI SENSORS)</text>
    </g>
  </g>

  <!-- Right Side: Bus Interconnect & Digital Architecture -->
  <g transform="translate(1180, 180)" stroke="#FFF0DC" stroke-width="1.2" fill="none" opacity="0.5">
    <path d="M 260 0 L 120 0 L 80 40 L 0 40"/>
    <path d="M 260 16 L 126 16 L 86 56 L 0 56"/>
    <circle cx="0" cy="40" r="3" fill="#FFF0DC"/>
    <circle cx="0" cy="56" r="3" fill="#FFF0DC"/>
    <text x="260" y="-10" fill="#FFF0DC" stroke="none" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" text-anchor="end" letter-spacing="1">DDR_COMMAND_ADDRESS_BUS</text>

    <!-- Logic Waveforms Timing Diagram -->
    <g transform="translate(40, 140)">
      <text x="0" y="-10" fill="#FFF0DC" stroke="none" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10">BUS CYCLE TIMING</text>
      <!-- Clock -->
      <path d="M 0 10 L 20 10 L 20 0 L 40 0 L 40 10 L 60 10 L 60 0 L 80 0 L 80 10 L 100 10 L 100 0 L 120 0 L 120 10 L 140 10 L 140 0 L 160 0 L 160 10 L 180 10 L 180 0 L 200 0"/>
      <!-- Enable -->
      <path d="M 0 30 L 60 30 L 60 20 L 180 20 L 180 30 L 200 30"/>
      <!-- Valid Data -->
      <path d="M 0 45 L 80 45 L 85 40 L 175 40 L 180 45 L 200 45"/>
      <path d="M 0 45 L 80 45 L 85 50 L 175 50 L 180 45 L 200 45"/>
    </g>

    <!-- CARLA Simulator Bridge -->
    <g transform="translate(0, 320)">
      <rect x="20" y="20" width="180" height="50" rx="6" stroke="#FFF0DC" stroke-width="1.2" fill="#52060B"/>
      <text x="110" y="44" fill="#FFF0DC" stroke="none" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">CARLA CO-SIMULATION HIL</text>
      <text x="110" y="58" fill="#FFF0DC" stroke="none" fill-opacity="0.8" font-family="'Space Grotesk', system-ui, sans-serif" font-size="8" text-anchor="middle">Time-To-Collision &lt; 1.8s</text>
    </g>
  </g>

  <!-- Title Block (Engineering Blueprint Standard in Lower Right) -->
  <g transform="translate(1030, 850)">
    <rect width="440" height="90" fill="#4A0509" stroke="#FFF0DC" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="0" y1="30" x2="440" y2="30" stroke="#FFF0DC" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="0" y1="60" x2="440" y2="60" stroke="#FFF0DC" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="220" y1="0" x2="220" y2="60" stroke="#FFF0DC" stroke-width="1" stroke-opacity="0.4"/>

    <text x="12" y="20" fill="#FFF0DC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">PROJECT: APURVA PORTFOLIO</text>
    <text x="232" y="20" fill="#FFF0DC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" letter-spacing="1">REV: 2.0 (GOLDEN RELEASE)</text>
    
    <text x="12" y="50" fill="#FFF0DC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" letter-spacing="1">DISCIPLINE: EMBEDDED &amp; ARCH</text>
    <text x="232" y="50" fill="#FFF0DC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" letter-spacing="1">CODE: 0x790B13 / #FFF0DC</text>

    <text x="12" y="78" fill="#FFF0DC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">AUTHOR: APURVA KUMAR // ENGINEER</text>
  </g>

  <!-- Left Bottom Specification Stamp -->
  <g transform="translate(64, 880)" fill="#FFF0DC" font-family="'Space Grotesk', system-ui, sans-serif" opacity="0.6">
    <text x="0" y="0" font-size="11" font-weight="700" letter-spacing="1">SYSTEMS VALIDATION: 100% CYCLE DETERMINISTIC</text>
    <text x="0" y="16" font-size="9" letter-spacing="0.8">gem5 cycle-accurate simulation · SPEC CPU2017 · FreeRTOS · CARLA · CAN-FD</text>
  </g>
</svg>